name: Deploy Cedibites API

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          envs: GH_TOKEN
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /var/www/production/laravel/cedibites_api
            # GitHub stopped serving anonymous git fetches to this server on
            # 2026-09-02. Every GET still works, but the git-upload-pack POST
            # that carries the objects returns 401 with
            # `www-authenticate: Basic realm="GitHub"`. The repos are public and
            # the server's credential store has been empty since June, so these
            # deploys had been relying on anonymous access all along.
            #
            # Deploy keys are disabled by org policy, so the fetch authenticates
            # with the workflow's own GITHUB_TOKEN. It is minted for this job and
            # expires with it, so nothing long-lived is stored on the server.
            # `-c` keeps the header on this one command rather than writing it
            # into .git/config.
            #
            # Trap: `git ls-remote` keeps working, because it only performs the
            # discovery GET. It will tell you the box is fine while every actual
            # fetch fails.
            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" fetch origin master
            git reset --hard origin/master
            composer install --no-dev --optimize-autoloader
            php artisan config:clear

            php artisan migrate --force

            # Permissions & roles are the source of truth — re-sync every deploy so
            # code that references new grants works without needing a migration.
            # All three seeders are idempotent, so re-running them is safe.
            php artisan db:seed --class=PermissionSeeder --force
            php artisan db:seed --class=RoleSeeder --force
            # Warehouse Manager Cleanup 2 — revokes the WM's stale grants that
            # RoleSeeder (additive) cannot remove. Idempotent; safe to keep.
            php artisan db:seed --class=WarehouseManagerCleanup2Seeder --force
            # Manager Scope Cleanup — same reason: revokes manage_menu,
            # manage_employees, manage_branches and delete_orders from the branch
            # manager, on the role and on any manager holding them directly.
            # manage_employees is what let a manager promote himself to tech_admin.
            # Idempotent; safe to keep.
            php artisan db:seed --class=ManagerScopeCleanupSeeder --force

            # Every active branch needs an inventory location or its manager is
            # locked out of the IMS and its sales are deducted from the mother
            # kitchen instead of its own stock. BranchProvisioningService creates
            # one at branch-creation time; this repairs anything that predates it.
            # Idempotent — a no-op once every branch has one.
            php artisan branch:provision-locations

            # Merge the per-branch duplicates of each dish into one. Idempotent:
            # once there are no duplicate slugs left it only tops up the
            # menu_item_branches pivot, which is what MenuItem::servedAt reads.
            # Leaving this manual is how the branch-to-location wiring drifted in
            # the first place.
            php artisan menu:unify

            # Ashaiman recipes, then a day's cover for the branch. Order matters:
            # the stock seeder derives its demand from the recipes.
            #
            # Both are safe on every deploy. The recipe seeder converges on one
            # definition per option and refuses any option whose dish has since
            # changed. The stock seeder only ever adds, and after its first run
            # of the day it tops up against the target it previously set rather
            # than the current balance — so a deploy mid-service cannot refill
            # what the morning already sold.
            php artisan db:seed --class=AshaimanRecipeSeeder --force
            php artisan db:seed --class=AshaimanTestStockSeeder --force
            # Repairs thresholds shipped inverted (min above reorder, so "Low"
            # never fires) and gives the branch its own reorder points, sized
            # from the recipes above. Warehouse-scale figures make a branch
            # holding a day of cover read Critical on nearly every line.
            php artisan db:seed --class=InventoryThresholdSeeder --force

            php artisan cache:clear
            php artisan route:clear
            php artisan view:clear

            # Queue workers are long-lived PHP processes: they hold the code that
            # was on disk when they booted and never notice a deploy. Without this
            # they keep running pre-deploy code indefinitely — which is exactly how
            # the SMS instrumentation shipped on 2026-07-31 recorded nothing until
            # the workers were bounced by hand, on code that was three days stale.
            #
            # MUST stay below cache:clear. queue:restart works by writing
            # `illuminate:queue:restart` into the cache, and the cache driver here
            # is `database` — clearing the cache afterwards would wipe the signal
            # and silently leave the workers running the old code.
            #
            # Graceful, not a kill: each worker finishes its current job, exits,
            # and PM2 restarts it. Nothing queued is lost — pending work lives in
            # the `jobs` table and failures in `failed_jobs`, not in the process.
            php artisan queue:restart

            sudo systemctl reload php8.4-fpm

            # Health check — confirms Laravel can bootstrap
            php artisan about --only=application
