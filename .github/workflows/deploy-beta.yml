name: Deploy Cedibites Beta API

on:
  push:
    branches:
      - beta
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy to beta (e.g. feature/ims)'
        required: true
        default: 'beta'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          envs: GH_TOKEN
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /var/www/beta/laravel/cedibites_api

            DEPLOY_BRANCH="${{ github.event.inputs.branch || 'beta' }}"
            # GitHub stopped serving anonymous git fetches to this server on
            # 2026-09-02. Every GET still works, but the git-upload-pack POST
            # that carries the objects returns 401 with
            # `www-authenticate: Basic realm="GitHub"`. The repos are public and
            # the server's credential store has been empty since June, so these
            # deploys had been relying on anonymous access all along.
            #
            # Deploy keys are disabled by org policy, so the fetch authenticates
            # with the workflow's own GITHUB_TOKEN. It is minted for this job and
            # expires with it, so nothing long-lived is stored on the server.
            # `-c` keeps the header on this one command rather than writing it
            # into .git/config.
            #
            # Trap: `git ls-remote` keeps working, because it only performs the
            # discovery GET. It will tell you the box is fine while every actual
            # fetch fails.
            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" fetch origin "$DEPLOY_BRANCH"
            git reset --hard "origin/$DEPLOY_BRANCH"

            composer install --no-dev --optimize-autoloader
            php artisan config:clear

            php artisan migrate --force

            # Permissions & roles are the source of truth — re-sync every deploy so
            # code that references new grants works without needing a migration.
            # All three seeders are idempotent, so re-running them is safe.
            php artisan db:seed --class=PermissionSeeder --force
            php artisan db:seed --class=RoleSeeder --force
            # Warehouse Manager Cleanup 2 — revokes the WM's stale grants that
            # RoleSeeder (additive) cannot remove. Idempotent; safe to keep.
            php artisan db:seed --class=WarehouseManagerCleanup2Seeder --force
            # Manager Scope Cleanup — same reason: revokes manage_menu,
            # manage_employees, manage_branches and delete_orders from the branch
            # manager, on the role and on any manager holding them directly.
            # manage_employees is what let a manager promote himself to tech_admin.
            # Idempotent; safe to keep.
            php artisan db:seed --class=ManagerScopeCleanupSeeder --force

            # Same two as production: every branch gets its inventory location,
            # and the per-branch menu duplicates are merged into one dish. Both
            # idempotent, so they settle to a no-op once done.
            php artisan branch:provision-locations
            php artisan menu:unify

            php artisan cache:clear
            php artisan route:clear
            php artisan view:clear

            # Same as production (see deploy.yml), and missing here until
            # 2026-08-07. Queue workers are long-lived PHP processes: they hold
            # the code that was on disk when they booted and never notice a
            # deploy. Beta ran `cedibites-beta-queue` for seven days across
            # several deploys, so the SMS campaign work shipped to a worker that
            # could not resolve its own new job classes and had to be bounced by
            # hand — twice in one afternoon.
            #
            # MUST stay below cache:clear. queue:restart works by writing
            # `illuminate:queue:restart` into the cache, and the cache driver
            # here is `database` — clearing the cache afterwards would wipe the
            # signal and silently leave the workers on the old code.
            #
            # Graceful, not a kill: each worker finishes its current job, exits,
            # and PM2 restarts it. Nothing queued is lost — pending work lives in
            # the `jobs` table and failures in `failed_jobs`, not in the process.
            php artisan queue:restart

            sudo systemctl reload php8.4-fpm

            # Health check — confirms Laravel can bootstrap
            php artisan about --only=application
